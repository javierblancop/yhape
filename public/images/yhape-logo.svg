<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Seamless geometric motif pattern -->
    <pattern id="tribal-pattern" x="0" y="0" width="100" height="70" patternUnits="userSpaceOnUse">
      <!-- Background white -->
      <rect width="100" height="70" fill="#ffffff" />
      
      <!-- Central Diamond -->
      <path d="M50 8 L82 35 L50 62 L18 35 Z" fill="none" stroke="#E19226" stroke-width="7" stroke-linejoin="miter" stroke-linecap="square" />
      <polygon points="50,22 63,35 50,48 37,35" fill="#E19226" />
      
      <!-- Left & Right connecting Chevrons/X -->
      <path d="M14 18 L0 35 L14 52" fill="none" stroke="#E19226" stroke-width="7" stroke-linejoin="miter" stroke-linecap="square" />
      <path d="M86 18 L100 35 L86 52" fill="none" stroke="#E19226" stroke-width="7" stroke-linejoin="miter" stroke-linecap="square" />
      
      <!-- Top/Bottom decorative notches -->
      <path d="M32 0 L50 15 L68 0" fill="none" stroke="#E19226" stroke-width="7" stroke-linejoin="miter" stroke-linecap="square" />
      <path d="M32 70 L50 55 L68 70" fill="none" stroke="#E19226" stroke-width="7" stroke-linejoin="miter" stroke-linecap="square" />
      
      <path d="M0 8 L10 0" stroke="#E19226" stroke-width="7" stroke-linecap="square" />
      <path d="M100 8 L90 0" stroke="#E19226" stroke-width="7" stroke-linecap="square" />
      <path d="M0 62 L10 70" stroke="#E19226" stroke-width="7" stroke-linecap="square" />
      <path d="M100 62 L90 70" stroke="#E19226" stroke-width="7" stroke-linecap="square" />
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean Canvas -->
  <rect width="600" height="600" fill="#ffffff" />

  <!-- TOP BORDER SECTION -->
  <!-- Outer Top Line -->
  <line x1="20" y1="36" x2="580" y2="36" stroke="#E19226" stroke-width="9" stroke-linecap="square" />
  
  <!-- Top Geometric Band -->
  <rect x="20" y="48" width="560" height="84" fill="url(#tribal-pattern)" />

  <!-- Top Inner Double Lines -->
  <line x1="20" y1="144" x2="580" y2="144" stroke="#E19226" stroke-width="9" stroke-linecap="square" />
  <line x1="20" y1="162" x2="580" y2="162" stroke="#E19226" stroke-width="5" stroke-linecap="square" />

  <!-- CENTER LOGO CONTENT -->
  <g id="brand-text">
    <!-- Main Title: YHAPE -->
    <text 
      x="300" 
      y="315" 
      text-anchor="middle" 
      font-family="'Outfit', 'Arial Black', -apple-system, sans-serif" 
      font-size="94" 
      font-weight="900" 
      letter-spacing="4" 
      fill="#3A1C0E">
      YHAPE
    </text>

    <!-- Subtitle: TAPAS & PICOTEO -->
    <text 
      x="300" 
      y="370" 
      text-anchor="middle" 
      font-family="'Outfit', -apple-system, 'Helvetica Neue', sans-serif" 
      font-size="28" 
      font-weight="900" 
      letter-spacing="7" 
      fill="#E19226">
      TAPAS &amp; PICOTEO
    </text>

    <!-- Byline: by K. Saez in italic cursive script -->
    <text 
      x="300" 
      y="415" 
      text-anchor="middle" 
      font-family="'Brush Script MT', 'Dancing Script', 'Caveat', 'Segoe Script', cursive" 
      font-size="28" 
      font-style="italic" 
      font-weight="600" 
      letter-spacing="1" 
      fill="#5A2912">
      by K. Saez
    </text>
  </g>

  <!-- BOTTOM BORDER SECTION -->
  <!-- Bottom Inner Double Lines -->
  <line x1="20" y1="454" x2="580" y2="454" stroke="#E19226" stroke-width="5" stroke-linecap="square" />
  <line x1="20" y1="472" x2="580" y2="472" stroke="#E19226" stroke-width="9" stroke-linecap="square" />

  <!-- Bottom Geometric Band -->
  <rect x="20" y="484" width="560" height="84" fill="url(#tribal-pattern)" />

  <!-- Outer Bottom Line -->
  <line x1="20" y1="580" x2="580" y2="580" stroke="#E19226" stroke-width="9" stroke-linecap="square" />
</svg>
